[[redirects]]
  from = "/api/*"
  to = "http://20.244.2.109:9005/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/departments-api/*"
  to = "http://20.244.2.109:3006/:splat"
  status = 200
  force = true

# Storage service routed via gateway (/storage/**).
[[redirects]]
  from = "/storage-api/*"
  # Frontend already includes /storage in the path (e.g. /storage-api/storage/upload),
  # so we forward directly to the gateway without adding another /storage prefix.
  to = "http://20.244.2.109:9005/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/grievance-service/*"
  to = "http://20.244.2.109:9005/grievance-service/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/feedback-service/*"
  to = "http://20.244.2.109:9005/feedback-service/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
