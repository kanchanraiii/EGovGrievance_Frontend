<aside class="sidebar" [class.collapsed]="collapsed()" [class.nav-open]="navOpen()">
  <div class="brand">
    <div class="brand-text" *ngIf="!collapsed()">
      <div class="brand-title">E-Grievance</div>
      <div class="brand-sub">Redressal Portal</div>
    </div>
    <button
      class="icon-button collapse-btn"
      (click)="toggle()"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      {{ collapsed() ? '>>' : '<<' }}
    </button>
    <button
      class="mobile-menu"
      type="button"
      (click)="toggleNav()"
      [attr.aria-expanded]="navOpen()"
      aria-label="Toggle navigation"
    >
      {{ navOpen() ? 'Close' : 'Menu' }}
    </button>
  </div>

  <nav class="nav" [class.open]="navOpen()">
    <ng-container *ngFor="let section of navSections; trackBy: trackSection">
      <div class="nav-section-title" *ngIf="!collapsed()">{{ section.title }}</div>
      <a
        *ngFor="let item of section.items; trackBy: trackNav"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        [fragment]="item.fragment"
        (click)="closeNav()"
      >
        <span class="nav-short">{{ item.short }}</span>
        <span class="nav-text">{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>
  <div class="spacer"></div>
  <ng-container *ngIf="isAuthed(); else signupLink">
    <div class="user-card-wrapper" (click)="toggleMenu()" [class.open]="menuOpen()">
      <div class="user-card" [title]="displayEmail">
        <img class="avatar" [src]="avatarUrl" alt="User avatar" />
        <div class="user-meta" *ngIf="!collapsed()">
          <div class="user-name">{{ displayName }}</div>
          <div class="user-email">{{ displayEmail }}</div>
        </div>
      </div>
      <div class="dropdown" *ngIf="menuOpen()">
        <button class="logout" type="button" (click)="logout()">Logout</button>
      </div>
    </div>
  </ng-container>
  <ng-template #signupLink>
    <a class="nav-item signup signup-bottom" routerLink="/auth" routerLinkActive="active" (click)="closeNav()">
      <span class="nav-short">S</span>
      <span class="nav-text">Sign Up</span>
    </a>
  </ng-template>
</aside>
